name: Publish public dashboard

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'lib/portfolio.mjs'
      - 'lib/public-snapshot.mjs'
      - 'lib/portfolio-github.mjs'
      - 'lib/github.mjs'
      - 'config/public-owners.json'
      - 'scripts/build-pages.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm run build:pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_DASHBOARD_MODE: ${{ vars.REPO_DASHBOARD_MODE || 'public' }}
          REPO_DASHBOARD_API_BASE_URL: ${{ vars.REPO_DASHBOARD_API_BASE_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
